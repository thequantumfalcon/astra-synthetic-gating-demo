name: release-attestation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  build-and-attest:
    name: build-and-attest
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Harden runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde
        with:
          egress-policy: audit

      - name: Set up Python 3.11.9
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate reproducible artifacts
        run: python repro/run_astra.py

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra

      - name: Build paper PDF
        run: python repro/build_paper.py

      - name: Prepare release archive
        run: |
          mkdir -p release-artifacts
          cp -r astra_output release-artifacts/astra_output
          cp -r astra_submission_bundle release-artifacts/astra_submission_bundle
          tar -czf astra-release-artifacts.tgz release-artifacts
          sha256sum astra-release-artifacts.tgz > astra-release-artifacts.tgz.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra-release-artifacts
          path: |
            astra-release-artifacts.tgz
            astra-release-artifacts.tgz.sha256
          if-no-files-found: error

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: astra-release-artifacts.tgz

name: release-attestation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload assets to when testing manually"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-attest:
    name: build-and-attest
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Set up Python 3.11.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install cyclonedx-bom==4.1.0

      - name: Generate reproducible artifacts
        run: python repro/run_astra.py

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra

      - name: Build paper PDF
        run: python repro/build_paper.py

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py requirements requirements-lock.txt --output-format JSON --outfile sbom.cdx.json

      - name: Prepare release archive
        run: |
          mkdir -p release-artifacts
          cp -r astra_output release-artifacts/astra_output
          cp -r astra_submission_bundle release-artifacts/astra_submission_bundle
          tar -czf astra-release-artifacts.tgz release-artifacts
          sha256sum astra-release-artifacts.tgz > astra-release-artifacts.tgz.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astra-release-artifacts
          path: |
            astra-release-artifacts.tgz
            astra-release-artifacts.tgz.sha256
            sbom.cdx.json
          if-no-files-found: error

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: astra-release-artifacts.tgz

      - name: Export in-toto provenance bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation download astra-release-artifacts.tgz --repo "$GITHUB_REPOSITORY"
          provenance_bundle=$(find . -maxdepth 1 -name 'sha256*.jsonl' -print -quit)
          test -n "$provenance_bundle"
          mv "$provenance_bundle" astra-release-artifacts.tgz.intoto.jsonl

      - name: Upload provenance bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astra-release-provenance
          path: astra-release-artifacts.tgz.intoto.jsonl
          if-no-files-found: error

      - name: Upload attested archive to GitHub Release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            astra-release-artifacts.tgz \
            astra-release-artifacts.tgz.sha256 \
            astra-release-artifacts.tgz.intoto.jsonl \
            sbom.cdx.json \
            --clobber

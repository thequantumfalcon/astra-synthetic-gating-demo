name: hardened-ci-template

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secure-template:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_TITLE: ${{ github.event.pull_request.title || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Mask runtime values
        run: |
          TEMP_VALUE="example-derived-value"
          echo "::add-mask::$TEMP_VALUE"
          printf 'PR title length: %s\n' "${#PR_TITLE}"

      - name: Install zizmor
        run: |
          python -m pip install --upgrade pip
          python -m pip install zizmor==1.28.0

      - name: Lint workflows with zizmor
        run: zizmor .github/workflows/

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q

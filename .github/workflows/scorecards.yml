name: scorecards

on:
  branch_protection_rule:
  schedule:
    - cron: "31 3 * * 1"
  push:
    branches: [main]

# The scorecard-action publish step rejects any workflow that grants write
# permissions at the top level; keep these read-only and scope writes to the job.
permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@820e3160e279568db735cee8ed8f8e77a6da7818
        with:
          sarif_file: results.sarif
